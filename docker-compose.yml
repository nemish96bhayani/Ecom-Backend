# Local development: MongoDB (single-node replica set, needed for transactions), Redis, API and worker.
#   docker compose up -d
#   then on the host: npm run seed -- --demo
services:
  mongo:
    image: mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  api:
    build: .
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/ecom_platform?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/ecom_platform?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
volumes:
  mongo-data:
